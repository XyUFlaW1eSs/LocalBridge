<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d1b2a"><title>LocalBridge</title><link rel="stylesheet" href="/app/styles.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">↗</span><span>LocalBridge</span><small>LAN workspace</small></div><div id="connection" class="connection"><span class="dot"></span>本机服务</div></header><main class="layout"><nav class="sidebar" aria-label="主导航"><button class="nav-item active" data-view="shares"><span>⇧</span>文件分享</button><button class="nav-item" data-view="receives"><span>⇩</span>接受记录</button><button class="nav-item" data-view="settings"><span>⚙</span>设置</button><div class="sidebar-note">所有文件只经过你的 LocalBridge 服务，不依赖云端。</div></nav><section class="content"><div id="notice" class="notice" role="status" hidden></div><section id="view-shares" class="view active"></section><section id="view-receives" class="view" hidden></section><section id="view-settings" class="view" hidden></section></section></main></div><script src="/app/app.js" defer></script></body></html>
