server:
  host: "0.0.0.0"
  port: 8899
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 60s

device:
  id: "windows-pc"
  name: "LocalBridge Windows"
  registry_path: "data/devices.json"

security:
  # Enable after setting a strong token. Pairing code is required by /api/v1/devices/pair.
  auth_enabled: false
  bearer_token: ""
  pairing_code: ""

discovery:
  # Discovery is an unauthenticated reachability hint; pairing still grants trust.
  enabled: false
  port: 8898
  announce_interval: 10s

clipboard:
  enabled: true
  max_text_bytes: 1048576
  watch_interval: 300ms

logging:
  level: "info"
  format: "text"
