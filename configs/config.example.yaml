server:
  host: "0.0.0.0"
  port: 8899
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 60s

device:
  id: "windows-pc"
  name: "LocalBridge Windows"
  registry_path: "data/devices.json"
  health_interval: 30s

security:
  # Enable after setting a strong token. Pairing code is required by /api/v1/devices/pair.
  auth_enabled: false
  bearer_token: ""
  pairing_code: ""

discovery:
  # Discovery is an unauthenticated reachability hint; pairing still grants trust.
  enabled: false
  port: 8898
  announce_interval: 10s

sync:
  enabled: true
  store_path: "data/sync-jobs.json"
  max_jobs: 1000
  job_retention: 168h

clipboard:
  enabled: true
  max_text_bytes: 1048576
  watch_interval: 300ms

files:
  enabled: true
  store_path: "data/files.json"
  receive_dir: "data/received"
  max_file_bytes: 2147483648
  max_total_bytes: 4294967296
  max_files_per_share: 100
  share_ttl: 24h
  upload_ttl: 24h

logging:
  level: "info"
  format: "text"
