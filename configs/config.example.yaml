version: 1

server:
  host: "0.0.0.0"
  port: 8899
  # TLS is opt-in for compatibility. When enabled, both files are required and
  # the process starts HTTPS only; it never silently falls back to HTTP.
  tls_enabled: false
  tls_cert_file: ""
  tls_key_file: ""
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 60s

device:
  id: "windows-pc"
  name: "LocalBridge Windows"
  registry_path: "data/devices.json"
  health_interval: 30s

security:
  # Windows auto mode uses current-user DPAPI for the credential store and peer registry.
  # Use required to reject inline secrets. Non-Windows requires explicit disabled legacy mode.
  credential_protection: auto
  credential_store_path: "data/credentials.json"
  # Write secrets with -credential-action set, then put only their reference names here.
  auth_enabled: false
  bearer_token: ""
  bearer_token_ref: ""
  pairing_code: ""
  pairing_code_ref: ""
  peer_token_ttl: 720h
  token_overlap_ttl: 10m

discovery:
  # Discovery is an unauthenticated reachability hint; pairing still grants trust.
  enabled: false
  port: 8898
  announce_interval: 10s

sync:
  enabled: true
  store_path: "data/sync-jobs.json"
  max_jobs: 1000
  job_retention: 168h

clipboard:
  enabled: true
  max_text_bytes: 1048576
  watch_interval: 300ms

files:
  enabled: true
  store_path: "data/files.json"
  share_dir: "data/shared"
  receive_dir: "data/received"
  max_file_bytes: 2147483648
  max_total_bytes: 4294967296
  max_files_per_share: 100
  share_ttl: 24h
  upload_ttl: 24h

settings:
  store_path: "data/settings.json"

logging:
  level: "info"
  format: "text"
